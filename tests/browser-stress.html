<!doctype html><meta charset="utf-8"><base href="/editor/"><title>ShowPiece isolated stress test</title><style>body{font:18px system-ui;padding:30px;background:#f7f3ec}canvas{width:480px;max-width:100%}li{padding:8px}</style><h1>Isolated video stress checks</h1><p>Generated media only. No physical microphone or customer allowance.</p><button id="run">Run stress checks</button><ul id="results"></ul><canvas id="canvas" width="640" height="360"></canvas><p id="status">Ready</p><script type="module">
import {VideoEngine,audioMime} from './engine.js';import {saveTake} from './narration.js';import {makeBackup,readBackup} from './backup.js';
const $=id=>document.getElementById(id),assert=(v,m)=>{if(!v)throw Error(m)},pass=m=>{const li=document.createElement('li');li.textContent='PASS: '+m;$('results').append(li)};
$('run').onclick=async()=>{let engine;try{$('run').disabled=true;
 const image=document.createElement('canvas');image.width=320;image.height=180;image.getContext('2d').fillRect(0,0,320,180);const blob=await new Promise(r=>image.toBlob(r)),thumb=blob;
 const clip=await (await fetch('./qa-clip.mp4')).blob();const items=[{id:'one',name:'Photo one',type:'image',seconds:1,blob,thumb},{id:'clip',name:'Test clip',type:'video',in:0,out:2,originalDuration:2,blob:clip,thumb},{id:'two',name:'Photo two',type:'image',seconds:1,blob,thumb}];
 const p={id:'test',name:'Stress project',cards:false,pace:1,area:'',details:'',items},brand={name:'Test brand',website:'',phone:'',cta:'',color:'#a84d34',logo:null};
 const ctx=new AudioContext();await ctx.resume();const tone=ctx.createOscillator(),out=ctx.createMediaStreamDestination();tone.frequency.value=660;tone.connect(out);const rec=new MediaRecorder(out.stream,{mimeType:audioMime()}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);const recorded=new Promise(r=>rec.onstop=r);rec.start();tone.start();await new Promise(r=>setTimeout(r,1200));rec.stop();tone.stop();await recorded;await ctx.close();saveTake(p,{blob:new Blob(chunks,{type:rec.mimeType}),start:0,end:1});
 engine=new VideoEngine($('canvas'),()=>{},()=>{});await engine.prepare(p,brand);await engine.seek(.5);const still=$('canvas').toDataURL();
 for(let n=1;n<=2;n++){let monitor=true;const watch=setInterval(()=>{monitor&&=engine.monitor.gain.value===0;},100);const file=await engine.export(v=>$('status').textContent='Export '+n+': '+Math.round(v*100)+'%',new AbortController().signal);clearInterval(watch);assert(file.size>1000,'Empty export');assert(monitor,'Speakers not muted');assert($('canvas').toDataURL()===still,'Visible preview changed');assert(engine.monitor.gain.value===1,'Playback monitor not restored');assert(Math.abs(engine.time-.5)<.01,'Preview position not restored');const audio=await engine.audio.decodeAudioData(await file.arrayBuffer());const a=audio.getChannelData(0);assert(a.some(v=>Math.abs(v)>.01),'Export audio is silent');pass('Mixed-media export '+n+' retains audio, freezes preview and restores playback');}
 const pre=new AbortController();pre.abort();await engine.export(()=>{},pre.signal).then(()=>{throw Error('Pre-cancel was ignored')},e=>assert(e.name==='AbortError','Incorrect cancellation error'));pass('Cancellation before rendering is safe');
 const abort=new AbortController();let requested=false;await engine.export(v=>{if(v>.2&&!requested){requested=true;abort.abort();}},abort.signal).then(()=>{throw Error('Mid-export cancel ignored')},e=>assert(e.name==='AbortError','Incorrect mid-cancel error'));assert(engine.monitor.gain.value===1,'Audio remained muted after cancel');pass('Mid-export cancellation restores preview and sound');
 const recovered=await engine.export(()=>{},new AbortController().signal);assert(recovered.size>1000,'Export failed after cancel');const check=await engine.audio.decodeAudioData(await recovered.arrayBuffer());assert(check.getChannelData(0).some(v=>Math.abs(v)>.01),'Audio lost after cancelled export');pass('Export after cancellation still contains audio');
 const copy=await readBackup(await makeBackup({project:p,brand}));assert(copy.project.items[1].blob.size===clip.size,'Clip lost in backup');assert(copy.project.voice.takes.length===1,'Narration lost in backup');pass('Backup preserves mixed media and narration');
 $('status').textContent='ALL BROWSER STRESS CHECKS PASSED';
 }catch(e){$('status').textContent='FAIL: '+e.stack;}finally{engine?.pause();$('run').disabled=false;}};
</script>
